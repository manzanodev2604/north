<style>
:root{--bg:#ECEEF2;--paper:#F8F9FB;--ink:#141C28;--soft:#55606F;--line:#C9CFD8;--accent:#1F3FA8;--accent-ink:#fff;--bad:#A3271B}
@media (prefers-color-scheme:dark){:root{--bg:#10151C;--paper:#19202A;--ink:#EDF0F5;--soft:#A0ABBA;--line:#343E4C;--accent:#8FA6F5;--accent-ink:#10151C;--bad:#F08A7E;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
body.wait form{visibility:hidden}
form{width:min(100%,340px);display:grid;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:24px}
h1{margin:0;font:800 2.2rem/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em}
.sub{margin:-6px 0 4px;color:var(--soft);font-size:.95rem}
label{display:grid;gap:4px;font-weight:600;font-size:.92rem}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
input#pin{letter-spacing:.5em;font-size:1.3rem}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{appearance:none;border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);font:700 1rem "Hanken Grotesk",system-ui,sans-serif;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}
.chk input{accent-color:var(--accent);width:18px;height:18px}
#err{margin:0;color:var(--bad);min-height:1.5em;font-size:.92rem}
</style>
</head>
<body>
<form id="f">
  <h1>North</h1>
  <p class="sub">Tu día organizado. Acceso privado.</p>
  <label>Usuario<input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  <label>PIN<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required></label>
  <label class="chk"><input type="checkbox" id="keep" checked> Recordar en este dispositivo</label>
  <button id="go">Entrar</button>
  <p id="err" role="alert"></p>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(raw){
  window.__northKey=raw; // la usa North para cifrar el estado sincronizado
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},k,b64(D.c)));
}
// Sustituir la página solo cuando ha terminado de cargar; antes, document.write añade en vez de reemplazar.
const show=html=>{const go=()=>{document.open();document.write(html);document.close()};document.readyState==='complete'?go():addEventListener('load',go)};
async function derive(user,pin){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(user+':'+pin),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(D.s),iterations:D.n},base,256));
}
// Clave recordada: vale mientras no cambien usuario ni PIN.
let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(saved&&saved.s===D.s){document.body.classList.add('wait');decrypt(b64(saved.k)).then(show).catch(()=>{document.body.classList.remove('wait');try{localStorage.removeItem(KEY)}catch(e){}})}
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;err.textContent='';
  try{
    const raw=await derive(document.getElementById('u').value.trim(),document.getElementById('pin').value);
    const html=await decrypt(raw);
    if(document.getElementById('keep').checked)try{localStorage.setItem(KEY,JSON.stringify({s:D.s,k:btoa(String.fromCharCode(...raw))}))}catch(x){}
    show(html);
  }catch(x){err.textContent='Usuario o PIN incorrectos.';btn.disabled=false;document.getElementById('pin').select()}
};
})();
